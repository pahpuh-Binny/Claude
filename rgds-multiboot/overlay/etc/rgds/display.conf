# RG DS screen layout for Kali (read by rgds-display-setup).
# Copy to ~/.config/rgds/display.conf to override per user.

# xrandr output names. "auto" picks the two DSI outputs in name order
# (first = bottom). If they come out swapped, run: rgds-display-setup --swap
TOP_OUTPUT=auto
BOTTOM_OUTPUT=auto

# normal | left | right | inverted, if a panel shows up sideways.
TOP_ROTATE=normal
BOTTOM_ROTATE=normal

# stacked (top above bottom, like a DS) | mirror | bottom-only | top-only
LAYOUT=stacked

# I2C bus of each Goodix touch panel, from the mainline device tree.
TOP_TOUCH_BUS=3
BOTTOM_TOUCH_BUS=5
