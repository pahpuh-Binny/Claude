# rgds-padmouse: RG DS controls as mouse + keyboard on Kali.
# Restart after editing:  sudo systemctl restart rgds-padmouse
# Event names are Linux input codes (see /usr/include/linux/input-event-codes.h).

[padmouse]
# Button that turns mouse mode off/on (HOME on the RG DS).
toggle = BTN_MODE
enabled_at_start = yes
# Pixels per second at full stick, wheel clicks per second at full stick.
pointer_speed = 900
scroll_speed = 14
deadzone = 0.12
# 1.0 = linear; higher = finer control near the centre.
curve = 2.0
pointer_axes = ABS_X ABS_Y
scroll_axes = ABS_RX ABS_RY
invert_pointer_x = no
invert_pointer_y = no
invert_scroll_y = yes

# Uncomment to replace the whole button map (the defaults are shown).
