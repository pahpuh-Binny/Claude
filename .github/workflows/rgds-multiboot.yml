name: RG DS multiboot toolkit

on:
  push:
    paths:
      - "rgds-multiboot/**"
      - ".github/workflows/rgds-multiboot.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdisk dosfstools mtools e2fsprogs shellcheck device-tree-compiler cpp python3

      - name: Lint and test
        working-directory: rgds-multiboot
        run: sudo make test
