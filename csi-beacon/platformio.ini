; CSI Beacon & WiFi-sensing radar firmware for the ESP32-2432S028R "Cheap Yellow Display".
;
;   pio run -e cyd                build for the original CYD (ILI9341, one micro-USB port)
;   pio run -e cyd2usb            build for the two-port CYD (ST7789, USB-C + micro-USB)
;   pio run -e cyd -t upload      build and flash over USB
;   pio run -e cyd -t upload -t monitor
;
; LoRa is OFF by default because the CYD has no onboard LoRa radio. Build with
; `-DENABLE_LORA=1` (see [env:cyd-lora]) only if you have wired an SX127x module.
;
; See README.md for flashing from a web browser without installing anything.

[platformio]
default_envs = cyd

[env]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DFW_VERSION=\"1.0.0\"
    ; --- TFT_eSPI settings for the CYD display (HSPI bus) ---
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
; If colours look wrong, swap red/blue or invert via the serial `color` command.
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_RGB

; ---- Same as cyd, but with LoRa compiled in (needs a wired SX127x module) ----
[env:cyd-lora]
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.1.2
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DENABLE_LORA=1
