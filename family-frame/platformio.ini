; Family Frame firmware for the ESP32-2432S028R "Cheap Yellow Display".
;
;   pio run -e cyd            build for the original CYD (ILI9341, one micro-USB port)
;   pio run -e cyd2usb        build for the two-port CYD (ST7789, USB-C + micro-USB)
;   pio run -e cyd -t upload  build and flash over USB
;
; Each build also writes .pio/build/<env>/family-frame-<env>-factory.bin, one file
; that a browser flasher writes at address 0x0 (see README.md).

[platformio]
default_envs = cyd

[env]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Two 1.9 MB app slots so the firmware can be updated from the web page.
board_build.partitions = min_spiffs.csv
extra_scripts = post:merge_bin.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    bblanchon/ArduinoJson@7.2.1
    earlephilhower/ESP8266Audio@1.9.7
build_flags =
    -DFW_VERSION=\"1.0.0\"
    ; TFT_eSPI settings for the CYD display (HSPI bus)
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
; If colours look wrong, fix them in the color check that runs on first start.
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_RGB
