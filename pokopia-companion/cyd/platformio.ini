; Pokopia Companion firmware for the ESP32-2432S028R "Cheap Yellow Display".
;
;   pio run -e cyd            build for the original CYD (ILI9341, one micro-USB port)
;   pio run -e cyd2usb        build for the two-port CYD (ST7789, USB-C + micro-USB)
;   pio run -e cyd -t upload  build and flash over USB
;
; See README.md for flashing from a web browser without installing anything.

[platformio]
default_envs = cyd

[env]
platform = platformio/espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 3 MB for the app (it carries the built-in Pokémon pictures), ~900 KB LittleFS for saves.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
extra_scripts = post:merge_bin.py
lib_deps =
    lvgl/lvgl@9.2.2
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DFW_VERSION=\"1.0.0\"
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; TFT_eSPI settings for the CYD display (HSPI bus)
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
; If colours look wrong, fix them in the color check that runs on first start.
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_RGB
